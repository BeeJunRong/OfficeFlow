openapi: 3.0.3
info:
  title: OfficeFlow API
  description: 任务型 AI Agent 办公信息整理助手 API，首版完整实现会议纪要 Skill。
  version: 1.6.0
  contact:
    name: 组号15
servers:
  - url: http://localhost:8000
    description: 本地开发环境

paths:
  /api/generate:
    post:
      summary: 生成结构化纪要
      description: 接收会议文本和任务类型，返回结构化纪要。首版仅 meeting_minutes 完整实现。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          description: 输入无效（如空输入）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 工具失败或模型错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/export:
    post:
      summary: 导出 Markdown
      description: 接收编辑后的纪要内容，生成 .md 文件。导出失败时返回错误，内容保留。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: 导出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '500':
          description: 导出失败，可重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/retry:
    post:
      summary: 重试导出
      description: 重试上一次失败的导出操作。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequest'
      responses:
        '200':
          description: 重试成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '500':
          description: 重试仍失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/status/{session_id}:
    get:
      summary: 查询工具调用状态
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 状态查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/derive:
    post:
      summary: 派生下游任务（FR-06）
      description: 基于已有会话产物派生下游任务，复用源结构化结果，不重新抽取。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeriveRequest'
      responses:
        '200':
          description: 派生成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          description: 不支持的派生方向
        '404':
          description: 源会话不存在
        '409':
          description: 源会话无可复用结果

  /api/email/send:
    post:
      summary: 显式发送邮件（Q-02：必须用户点击触发）
      description: 默认协议 draft_only 只返回预览；真实发送需四重闸门（显式点击 + confirm=true + SMTP 配置齐全 + 总开关=1）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSendRequest'
      responses:
        '200':
          description: 处理完成（含 preview/sent/skipped/failed 逐封结果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSendResponse'

  /api/email/protocols:
    get:
      summary: 协议清单与 SMTP 可用性
      description: 前端展示用：可用发送协议、当前协议能力与能否真实发送。
      responses:
        '200':
          description: 协议清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolsResponse'

  /api/download:
    get:
      summary: 下载导出的 .md 文件
      description: 仅限 exports 目录内，防路径穿越。
      parameters:
        - name: file_path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 文件流
        '403':
          description: 非法文件路径
        '404':
          description: 文件不存在

  /api/config:
    get:
      summary: 读取配置（密钥掩码，绝不回传明文）
      responses:
        '200':
          description: 当前配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigView'
    post:
      summary: 保存配置到 .env
      description: 白名单外的键会被拒绝；空值视为未修改；模型配置写入后重置 LLM 单例。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: 保存成功（含需重启项）
        '400':
          description: 白名单外键或类型校验失败

  /api/config/test:
    post:
      summary: 测试模型连通性（可传未保存的值，先测再存）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigTestRequest'
      responses:
        '200':
          description: 测试结果

  /api/health:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 服务正常

  # ---------- 认证（登录/注册/登出） ----------

  /api/auth/register:
    post:
      summary: 注册新用户
      description: 用户名 2-32 字符、密码 ≥6 位；口令 PBKDF2 散列存储。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 注册成功
        '400':
          description: 用户名/密码校验失败
        '409':
          description: 用户名已被注册

  /api/auth/login:
    post:
      summary: 登录
      description: 校验口令后签发 7 天有效的 Bearer 令牌。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 登录成功，返回 token
        '401':
          description: 用户名或密码错误

  /api/auth/logout:
    post:
      summary: 登出（吊销令牌）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 登出成功

  # ---------- 对话管理（登录后，按用户隔离） ----------

  /api/conversations:
    get:
      summary: 当前用户的对话列表
      description: 最近更新在前，不含轮次正文。
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 对话列表
    post:
      summary: 新建对话
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
      responses:
        '200':
          description: 新建成功

  /api/conversations/{conv_id}:
    get:
      summary: 取单个对话（含完整轮次）
      parameters:
        - name: conv_id
          in: path
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 对话详情
        '404':
          description: 对话不存在
    put:
      summary: 更新对话标题和/或轮次
      parameters:
        - name: conv_id
          in: path
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationUpdateRequest'
      responses:
        '200':
          description: 更新成功
    delete:
      summary: 删除对话
      parameters:
        - name: conv_id
          in: path
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功

components:
  schemas:
    GenerateRequest:
      type: object
      required:
        - input_text
      properties:
        input_text:
          type: string
          description: 会议原始文字记录，建议 ≤4000 汉字
        task_type:
          type: string
          enum: [meeting_minutes, weekly_report, email_draft, web_summary]
          description: 显式任务类型，若前端点击提示按钮则传递
        session_id:
          type: string
          description: 可选会话 ID

    GenerateResponse:
      type: object
      description: 多产物契约：structured_result 为会议纪要专用（向后兼容），
        其余 Skill 各用专有字段；derived_tasks 承载"可继续派生"的建议（理解 C）。
      properties:
        session_id:
          type: string
        task_type:
          type: string
        routed_by:
          type: string
          description: explicit / keyword / llm / fallback_rule / react
        needs_clarification:
          type: boolean
          description: 路由置信度不足时为 True，前端应提示用户选择任务类型
        message:
          type: string
        structured_result:
          $ref: '#/components/schemas/MeetingMinutes'
        email_draft:
          $ref: '#/components/schemas/EmailDraft'
        weekly_report:
          $ref: '#/components/schemas/WeeklyReport'
        web_summary:
          $ref: '#/components/schemas/WebSummary'
        derived_tasks:
          type: array
          items:
            $ref: '#/components/schemas/DerivedTask'
          description: 基于本次产物可继续生成的任务；需用户点击才执行
        derived_from:
          type: string
          description: 派生来源会话 id（空=本轮为原始输入）
        markdown:
          type: string
        tool_logs:
          type: array
          items:
            $ref: '#/components/schemas/ToolLog'
        error_message:
          type: string
        reasoning_trace:
          type: array
          items:
            type: object
          description: ReAct 每轮决策追溯（step/thought/action/action_input/observation/status）
        react_iteration:
          type: integer
          description: ReAct 循环迭代轮数（0=未走 ReAct）
        outputs:
          type: array
          items:
            type: object
          description: 多步产物列表（多步规划时每个子任务的 markdown + 结构化结果）

    MeetingMinutes:
      type: object
      description: 会议纪要结构化输出（标准六段式模板）
      properties:
        date:
          type: string
          example: "2026-10-09"
        location:
          type: string
        host:
          type: string
        attendees:
          type: array
          items:
            type: string
        observers:
          type: array
          items:
            type: string
        absentees:
          type: array
          items:
            type: string
        recorder:
          type: string
        reviewer:
          type: string
        topic:
          type: string
        agenda:
          type: array
          items:
            type: string
        discussion:
          type: array
          items:
            type: string
        decisions:
          type: array
          items:
            type: string
        action_items:
          type: array
          items:
            $ref: '#/components/schemas/ActionItem'
        risks:
          type: array
          items:
            type: string
        next_meeting:
          type: object
          properties:
            time:
              type: string
            location:
              type: string
            agenda:
              type: string
        attachments:
          type: array
          items:
            type: string

    ActionItem:
      type: object
      description: 单条待办事项（六段式扩展字段）
      properties:
        task:
          type: string
        owner:
          type: string
          example: "张三"
        co_owner:
          type: string
          description: 协办
        deadline:
          type: string
          example: "2026-10-12"
        deliverable:
          type: string
          description: 输出物
        evidence:
          type: string
          description: 原文证据片段
        evidence_line:
          type: integer
          nullable: true
          description: 证据片段在原始输入中的行号（1-based）

    ToolLog:
      type: object
      properties:
        tool_name:
          type: string
        status:
          type: string
          enum: [success, failed]
        error_message:
          type: string
        timestamp:
          type: string
          format: date-time

    ExportRequest:
      type: object
      required:
        - session_id
        - content
      properties:
        session_id:
          type: string
        content:
          type: string
          description: 用户编辑后的 Markdown 内容

    ExportResponse:
      type: object
      properties:
        file_name:
          type: string
        download_url:
          type: string
        status:
          type: string
          enum: [success, failed]

    RetryRequest:
      type: object
      required:
        - session_id
      properties:
        session_id:
          type: string

    StatusResponse:
      type: object
      properties:
        session_id:
          type: string
        task_type:
          type: string
        status:
          type: string
          enum: [idle, generating, exporting, failed, success]
        tool_logs:
          type: array
          items:
            $ref: '#/components/schemas/ToolLog'

    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
        retryable:
          type: boolean

    DeriveRequest:
      type: object
      required:
        - session_id
        - task_type
      properties:
        session_id:
          type: string
          description: 源会话 ID
        task_type:
          type: string
          enum: [weekly_report, email_draft]
          description: 派生目标任务类型

    EmailSendRequest:
      type: object
      required:
        - protocol
        - sender
        - subject
        - recipients
      properties:
        session_id:
          type: string
        protocol:
          type: string
          enum: [draft_only, mailto, smtp]
          default: draft_only
        sender:
          type: string
        subject:
          type: string
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/EmailRecipient'
        confirm:
          type: boolean
          default: false
          description: 显式确认发送（四重闸门第 2 重）

    EmailRecipient:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          description: 用户手填，系统绝不推测或拼接
        content:
          type: string
        send:
          type: boolean
          default: false
          description: 是否勾选发送这封

    EmailSendResult:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [sent, preview, skipped, failed]
        detail:
          type: string

    EmailSendResponse:
      type: object
      properties:
        protocol:
          type: string
        dry_run:
          type: boolean
          description: true=未真实发送（preview/skipped/failed）
        results:
          type: array
          items:
            $ref: '#/components/schemas/EmailSendResult'
        error_message:
          type: string

    ProtocolsResponse:
      type: object
      properties:
        default:
          type: string
        protocols:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
        smtp_available:
          type: boolean
        smtp_enabled:
          type: boolean
        smtp_missing:
          type: array
          items:
            type: string
        note:
          type: string

    ConfigView:
      type: object
      description: 当前配置视图（密钥已掩码）

    ConfigUpdateRequest:
      type: object
      properties:
        updates:
          type: object
          description: 键值对（仅白名单内 16 个键可写）
        clear:
          type: array
          items:
            type: string
          description: 显式清空的键

    ConfigTestRequest:
      type: object
      properties:
        base_url:
          type: string
        api_key:
          type: string
        model_name:
          type: string
        timeout:
          type: integer
          default: 15

    WebSummary:
      type: object
      description: 网页整理结构化输出（FR-04；单页读取，不批量爬取、不登录）
      properties:
        title:
          type: string
          description: 网页标题
        url:
          type: string
          description: 来源 URL
        points:
          type: array
          items:
            type: string
          description: 3-6 条摘自原文段落的要点
        word_count:
          type: integer
          description: 正文约字数

    WeeklyReportItem:
      type: object
      description: 周报条目（保留 owner/deadline/evidence 便于零编造核对）
      properties:
        content:
          type: string
        owner:
          type: string
        deadline:
          type: string
        evidence:
          type: string
          description: 原文证据片段
        evidence_line:
          type: integer
          nullable: true
          description: 证据片段在原始输入中的行号（1-based）

    WeeklyReport:
      type: object
      description: 周报结构化输出（由会议纪要派生：决定→进展，待办→下周计划）
      properties:
        period:
          type: string
          description: 报告周期
        topic:
          type: string
          description: 来源会议主题
        progress:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyReportItem'
          description: 本周进展（来自关键决定）
        next_plan:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyReportItem'
          description: 下周计划（来自待办事项）
        risks:
          type: array
          items:
            type: string
          description: 风险与待确认项
        source_date:
          type: string
          description: 来源会议日期（溯源用）

    EmailDraft:
      type: object
      description: 邮件草稿（发件人本人 + 协议 + 收件人列表）
      properties:
        sender:
          type: string
          description: 发件人（本人）；缺失显示待确认
        protocol:
          type: string
          enum: [draft_only, mailto, smtp]
          default: draft_only
          description: 发送协议，默认 draft_only（不发送）
        subject:
          type: string
        greeting:
          type: string
          description: 称呼语（可按收件人替换）
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/EmailRecipient'
        shared_body:
          type: string
          description: 公共正文（可编辑，作为各封邮件的基础）
        source_topic:
          type: string
          description: 来源会议主题（溯源用）
        source_date:
          type: string
          description: 来源会议日期（溯源用）

    DerivedTask:
      type: object
      description: 可派生的下游任务（由当前产物推导，需用户点击才执行）
      properties:
        task_type:
          type: string
        label:
          type: string
          description: 按钮文案
        reason:
          type: string
          description: 为何可派生（含人数/条目数等依据）

    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128

    LogoutRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    ConversationCreateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 64
          default: 新对话

    ConversationUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 64
          nullable: true
        turns:
          type: array
          nullable: true
          items:
            type: object
          description: 前端每次生成后整存整取的轮次 JSON 序列
