<section class="composer-shell" aria-label="OfficeFlow 消息输入">
  <div class="composer-card">
    <textarea aria-label="消息内容" placeholder="输入或粘贴内容，让 OfficeFlow 帮你整理…" rows="2"></textarea>
    <div class="composer-toolbar">
      <div class="task-chips" role="group" aria-label="选择任务类型"></div>
      <button class="send" type="button" aria-label="发送消息" title="发送（Enter）" disabled>↑</button>
    </div>
  </div>
  <div class="composer-hint" aria-live="polite">Enter 发送 · Shift + Enter 换行</div>
</section>
